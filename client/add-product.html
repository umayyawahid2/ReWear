<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Item — ReWear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-rewear sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <i class="bi bi-recycle text-success fs-3"></i> <span>ReWear</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Shop Marketplace</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="navAuthContainer">
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h3 class="fw-bold mb-1" id="formTitle">Sell Your Clothes</h3>
                    <p class="text-muted mb-4">List pre-loved apparel items for nearby buyers</p>

                    <form id="productForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Product Title</label>
                            <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Zara Summer Floral Dress" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Category</label>
                                <select id="category" name="category" class="form-select" required>
                                    <option value="Dresses">Dresses</option>
                                    <option value="Shirts">Shirts & Tops</option>
                                    <option value="Pants">Pants & Jeans</option>
                                    <option value="Jackets">Jackets & Coats</option>
                                    <option value="Shoes">Shoes</option>
                                    <option value="Accessories">Accessories</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Size</label>
                                <select id="size" name="size" class="form-select" required>
                                    <option value="XS">XS</option>
                                    <option value="S">S</option>
                                    <option value="M" selected>M</option>
                                    <option value="L">L</option>
                                    <option value="XL">XL</option>
                                    <option value="XXL">XXL</option>
                                    <option value="Free Size">Free Size</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Brand</label>
                                <input type="text" id="brand" name="brand" class="form-control" placeholder="e.g. Zara, Mango, Khaadi">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Condition</label>
                                <select id="condition" name="condition" class="form-select" required>
                                    <option value="Brand New">Brand New</option>
                                    <option value="Like New" selected>Like New</option>
                                    <option value="Gently Used">Gently Used</option>
                                    <option value="Well Worn">Well Worn</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Price (Rs.)</label>
                                <input type="number" id="price" name="price" class="form-control" placeholder="e.g. 2500" min="0" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Item Location</label>
                                <input type="text" id="location" name="location" class="form-control" placeholder="e.g. Islamabad, F-8">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea id="description" name="description" class="form-control" rows="4" placeholder="Describe the item, fabric, fit, and any minor flaws..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Product Photo</label>
                            <input type="file" id="image" name="image" class="form-control" accept="image/*">
                            <small class="form-text text-muted">Supports JPG, PNG, WEBP (Max 5MB)</small>
                        </div>

                        <div class="d-flex gap-3">
                            <button type="submit" id="submitBtn" class="btn btn-rewear-primary py-2 px-4 flex-grow-1">List Item Now</button>
                            <a href="profile.html" class="btn btn-outline-secondary py-2 px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container text-center">
            <p class="mb-1 fw-bold">ReWear — Sustainable Fashion Marketplace</p>
            <p class="small text-white-50">Built for 2-Day MVP Demo | Node.js + Express + MongoDB + Bootstrap</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/add-product.js"></script>
</body>
</html>
