<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — ReWear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-rewear sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <i class="bi bi-recycle fs-3"></i> <span>ReWear</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Shop Marketplace</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="navAuthContainer">
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div id="profileInfoContainer">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
                <div>
                    <button class="btn btn-outline-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                        <i class="bi bi-pencil-square me-1"></i> Edit Profile
                    </button>
                </div>
            </div>
        </div>

        <ul class="nav nav-tabs mb-4" id="profileTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="listings-tab" data-bs-toggle="tab" data-bs-target="#listingsTabPane" type="button" role="tab">
                    <i class="bi bi-tags me-1"></i> My Listings
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="saved-tab" data-bs-toggle="tab" data-bs-target="#savedTabPane" type="button" role="tab">
                    <i class="bi bi-heart me-1"></i> Saved Wishlist Items
                </button>
            </li>
        </ul>

        <div class="tab-content" id="profileTabContent">
            <div class="tab-pane fade show active" id="listingsTabPane" role="tabpanel" tabindex="0">
                <div class="row" id="myListingsContainer">
                </div>
            </div>

            <div class="tab-pane fade" id="savedTabPane" role="tabpanel" tabindex="0">
                <div class="row" id="savedItemsContainer">
                </div>
            </div>
        </div>

        <!-- Edit Profile Modal -->
        <div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg rounded-4">
                    <div class="modal-header bg-light border-0">
                        <h5 class="modal-title fw-bold"><i class="bi bi-person-gear text-primary me-2"></i> Edit Account Info</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="editProfileForm">
                        <div class="modal-body p-4">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" id="profileName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <div class="input-group phone-input-group">
                                    <select id="editCountryCode" class="form-select" style="max-width: 140px;" required>
                                        <!-- Populated via JS -->
                                    </select>
                                    <input type="tel" id="profilePhone" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">City / Location</label>
                                <input type="text" id="profileLocation" class="form-control" required>
                            </div>
                        </div>
                        <div class="modal-footer bg-light border-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-rewear-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container text-center">
            <p class="mb-1 fw-bold">ReWear — Sustainable Fashion Marketplace</p>
            <p class="small text-white-50">Built for 2-Day MVP Demo | Node.js + Express + MongoDB + Bootstrap</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
